<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Adriana Reatigui Mateus — Geóloga y desarrolladora junior</title>
  <desc id="d">Banner con un volcán, capas de roca y contornos topográficos que se mezclan con código.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171412"/><stop offset="1" stop-color="#2b2220"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a31"/><stop offset="1" stop-color="#241c18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .name{font:700 54px Georgia,'Times New Roman',serif;fill:#F3E6D3;letter-spacing:.5px}
      .sub{font:400 27px Georgia,'Times New Roman',serif;fill:#E0B887;font-style:italic}
      .tag{font:500 15px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#5EEAD4}
      .dim{font:400 15px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#A8998A}
      .in{animation:rise .9s ease-out both}
      .in2{animation:rise .9s .25s ease-out both}
      .in3{animation:rise .9s .5s ease-out both}
      .pulse{animation:pulse 3.2s ease-in-out infinite;transform-origin:930px 104px}
      .ember{animation:float 4s ease-in infinite}
      .e2{animation-delay:1.3s} .e3{animation-delay:2.4s} .e4{animation-delay:.6s}
      .drift{animation:drift 9s ease-in-out infinite alternate}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
      @keyframes float{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-80px)}}
      @keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- curvas de nivel -->
    <g fill="none" stroke="#2DD4BF" stroke-opacity=".16" stroke-width="1.2">
      <ellipse cx="930" cy="150" rx="150" ry="62"/><ellipse cx="930" cy="150" rx="215" ry="92"/>
      <ellipse cx="930" cy="150" rx="285" ry="124"/><ellipse cx="930" cy="150" rx="360" ry="158"/>
      <ellipse cx="930" cy="150" rx="440" ry="196"/>
    </g>

    <!-- símbolos de código flotando como clastos -->
    <g font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="#5EEAD4" fill-opacity=".28" font-size="34">
      <text x="640" y="70">{ }</text><text x="1090" y="60">&lt;/&gt;</text><text x="1120" y="190">[ ]</text>
    </g>

    <!-- volcán -->
    <path d="M740 262 L880 124 Q930 96 980 124 L1120 262 Z" fill="url(#cone)"/>
    <path d="M880 124 Q930 96 980 124 L968 132 Q930 118 892 132 Z" fill="#3a2d26"/>
    <ellipse class="pulse" cx="930" cy="104" rx="70" ry="30" fill="url(#glow)"/>
    <path d="M920 112 Q912 150 925 176 T912 236 L936 236 Q946 190 936 160 T942 112 Z" fill="#F97316" fill-opacity=".85"/>
    <path d="M950 118 Q962 150 954 188 T968 240 L982 240 Q974 196 972 160 T962 118 Z" fill="#EA580C" fill-opacity=".7"/>
    <g fill="#FDBA74">
      <circle class="ember" cx="915" cy="98" r="2.6"/><circle class="ember e2" cx="945" cy="92" r="2.2"/>
      <circle class="ember e3" cx="930" cy="96" r="3"/><circle class="ember e4" cx="960" cy="100" r="1.8"/>
    </g>

    <!-- texto -->
    <g class="in"><text class="tag" x="70" y="88">// geologia.py  +  desarrollo.js</text></g>
    <g class="in2"><text class="name" x="70" y="156">Adriana Reatigui Mateus</text></g>
    <g class="in3">
      <text class="sub" x="70" y="200">Geóloga y desarrolladora junior</text>
      <text class="dim" x="70" y="232">Python · JavaScript · SQL · n8n</text>
    </g>

    <!-- estratos -->
    <g class="drift">
      <path d="M-40 262 C160 240 360 284 560 262 S960 238 1240 266 L1240 340 L-40 340Z" fill="#5C4636"/>
      <path d="M-40 284 C200 266 420 304 660 286 S1020 268 1240 288 L1240 340 L-40 340Z" fill="#7B5B3E"/>
      <path d="M-40 306 C240 292 460 322 700 308 S1040 294 1240 310 L1240 340 L-40 340Z" fill="#A67C52"/>
    </g>
    <path d="M0 326 C300 316 560 336 820 326 S1100 318 1200 326 L1200 340 L0 340Z" fill="#0F766E"/>
  </g>
</svg>