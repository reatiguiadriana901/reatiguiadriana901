<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="st sd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="st">Tech stack como columna estratigráfica</title>
  <desc id="sd">Cinco capas: frontend, lenguajes y análisis, bases de datos, herramientas y procesos, y SIG.</desc>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#fff" fill-opacity=".07"/><circle cx="10" cy="10" r="1.1" fill="#fff" fill-opacity=".05"/></pattern>
    <style>
      .lt{font:700 19px Georgia,'Times New Roman',serif;fill:#F3E6D3}
      .ls{font:400 14px Georgia,'Times New Roman',serif;font-style:italic;fill:#B9A894}
      .ch{font:500 14px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#F6EBDD}
      .layer{animation:in .7s ease-out both}
      @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
